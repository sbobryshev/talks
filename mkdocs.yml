site_name: "Разборы: Программирование"
site_url: https://sbobryshev.github.io/talks/

theme:
  name: material
  language: ru
  palette:
    scheme: slate
    primary: black
    accent: indigo
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top

nav:
  - "Главная": index.md
  - "Mock":
      - "1. Мок существующего метода": 1_mock_existent_method.md
      - "2. Мок несуществующего метода": 2_mock_non_existent_method.md
      - "3. side_effect: Исключения": 3_side_effect_exception.md
      - "4. side_effect: Возвращаемые значения": 4_side_effect_content.md
      - "5. spec и autospec": 5_spec.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: "."
  - admonition
  - toc:
      permalink: true
